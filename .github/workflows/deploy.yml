# Prepared V2 release workflow. Manual dispatch is the only deployment trigger.
# Enable Pages with source "GitHub Actions" only when the V2 launch is approved.
name: Deploy V2 to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: v2/package-lock.json
      - run: npm ci
        working-directory: v2
      - run: npm run build
        working-directory: v2
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: v2/dist
      - id: deployment
        uses: actions/deploy-pages@v4
